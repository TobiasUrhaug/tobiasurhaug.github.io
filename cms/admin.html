<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O.M.Theorem CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #1a1a18;
            --ink-soft: #3a3a38;
            --paper: #ffffff;
            --mid: #6b6b68;
            --rule: #c8c6be;
            --wash: #f5f4f0;
            --ok: #2f6b3a;
            --err: #a33a2a;
            --font-mono: 'Courier Prime', 'Courier New', monospace;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
        }

        .wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 6rem; }

        header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 1rem;
            border-bottom: 1px solid var(--ink);
            padding-bottom: 0.8rem;
        }

        h1 { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; }
        h2 { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 1rem; }

        a { color: var(--ink); }

        .tabs { display: flex; gap: 1.5rem; padding: 1rem 0; border-bottom: 1px solid var(--rule); }

        .tabs button, .btn {
            font: inherit;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: none;
            border: none;
            color: var(--mid);
            cursor: pointer;
        }

        .tabs button.active { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }

        .btn { border: 1px solid var(--ink); color: var(--ink); padding: 0.5rem 1rem; }
        .btn.primary { background: var(--ink); color: var(--paper); }
        .btn.danger { border-color: var(--err); color: var(--err); margin-left: auto; }
        .btn:disabled { opacity: 0.4; cursor: default; }

        #status {
            min-height: 1.6rem;
            margin: 1rem 0;
            font-size: 12px;
        }
        #status.ok { color: var(--ok); }
        #status.err { color: var(--err); }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }

        table { width: 100%; border-collapse: collapse; }
        td {
            padding: 0.55rem 0.5rem 0.55rem 0;
            border-bottom: 1px solid var(--rule);
            vertical-align: baseline;
        }
        tr { cursor: pointer; }
        tr:hover td { background: var(--wash); }
        tr.past td { color: var(--mid); }
        td.key { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; width: 8.5rem; }
        td.meta { font-size: 11px; color: var(--mid); }
        .empty { color: var(--mid); padding: 1rem 0; }

        form { display: grid; gap: 1rem; padding: 1.5rem; background: var(--wash); margin-bottom: 2rem; }

        label { display: grid; gap: 0.3rem; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        .hint { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--mid); }

        input, textarea {
            font: inherit;
            font-size: 14px;
            padding: 0.5rem 0.6rem;
            border: 1px solid var(--rule);
            background: var(--paper);
            color: var(--ink);
            width: 100%;
        }
        input:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
        textarea { min-height: 7rem; resize: vertical; line-height: 1.6; }
        textarea.long { min-height: 16rem; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .images { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1rem; }
        .image-slot { display: grid; gap: 0.4rem; align-content: start; font-size: 11px; }
        .image-slot img { width: 100%; max-height: 180px; object-fit: contain; background: var(--paper); border: 1px solid var(--rule); }
        .image-slot .none { height: 80px; display: grid; place-items: center; border: 1px dashed var(--rule); color: var(--mid); }
        .image-slot input[type=file] { font-size: 11px; padding: 0.3rem; }

        .actions { display: flex; gap: 0.75rem; align-items: center; }

        footer.note { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: 12px; color: var(--mid); }
        code { background: var(--wash); padding: 0 0.3em; }

        @media (max-width: 560px) {
            .row { grid-template-columns: 1fr; }
            form { padding: 1rem; }
            td.meta.hide-sm { display: none; }
        }
    </style>
</head>
<body>
<div class="wrap">

    <header>
        <h1>O.M.Theorem — CMS</h1>
        <a href="/" target="_blank" rel="noopener">Preview site ↗</a>
    </header>

    <nav class="tabs">
        <button data-tab="gigs">Gigs</button>
        <button data-tab="releases">Releases</button>
        <button data-tab="news">News</button>
        <button data-tab="about">About</button>
    </nav>

    <div id="status" role="status"></div>

    <main id="view"></main>

    <footer class="note">
        Saving writes to <code>content/</code> and rebuilds <code>index.html</code>.
        When you're happy with the preview, commit and push as usual
        (<code>git add -A &amp;&amp; git commit -m "…" &amp;&amp; git push</code>).
    </footer>

</div>

<script>
// ── State ─────────────────────────────────────────────

let content = null;
let tab = 'gigs';
let editing = null;   // { kind, index } — index -1 means "new"

const view = document.getElementById('view');
const statusEl = document.getElementById('status');

const today = new Date().toISOString().slice(0, 10);
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const displayDate = iso => { const [y, m, d] = iso.split('-'); return `${d} ${MONTHS[m - 1]} ${y}`; };

const slugify = s => s.toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function setStatus(msg, kind = '') {
    statusEl.textContent = msg;
    statusEl.className = kind;
}

// ── API ───────────────────────────────────────────────

async function api(method, url, body) {
    const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || res.statusText);
    return json;
}

function readFile(file) {
    return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.readAsDataURL(file);
    });
}

async function uploadImage(file, name) {
    const { path } = await api('POST', '/api/images', { name, dataUrl: await readFile(file) });
    return path;
}

async function save(fn, successMsg) {
    const buttons = view.querySelectorAll('button');
    buttons.forEach(b => b.disabled = true);
    setStatus('Saving…');
    try {
        content = await fn();
        editing = null;
        setStatus(`${successMsg} — index.html rebuilt.`, 'ok');
        render();
    } catch (err) {
        setStatus(`Error: ${err.message}`, 'err');
        buttons.forEach(b => b.disabled = false);
    }
}

// Drop empty strings / empty lists so the content files stay tidy
function clean(obj) {
    return Object.fromEntries(Object.entries(obj).filter(([, v]) =>
        v !== '' && v != null && !(Array.isArray(v) && v.length === 0)));
}

// ── Form helpers ──────────────────────────────────────

const field = (name, label, value, { type = 'text', hint = '', required = false, placeholder = '', list = '' } = {}) => `
    <label>${label}${hint ? ` <span class="hint">${hint}</span>` : ''}
        <input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"
               ${required ? 'required' : ''} ${list ? `list="${list}"` : ''}>
    </label>`;

const area = (name, label, value, { hint = '', long = false, required = false } = {}) => `
    <label>${label}${hint ? ` <span class="hint">${hint}</span>` : ''}
        <textarea name="${name}" class="${long ? 'long' : ''}" ${required ? 'required' : ''}>${esc(value)}</textarea>
    </label>`;

const imageSlot = (name, label, current) => `
    <div class="image-slot" data-slot="${name}">
        <strong>${label}</strong>
        ${current ? `<img src="/${esc(current)}" alt="">` : '<div class="none">No image</div>'}
        <input type="file" name="${name}" accept="image/*">
        ${current ? `<label style="font-weight:400;text-transform:none;letter-spacing:0;display:flex;gap:.4rem">
            <input type="checkbox" name="${name}-remove" style="width:auto"> Remove</label>` : ''}
    </div>`;

const formActions = (isNew, label) => `
    <div class="actions">
        <button class="btn primary" type="submit">${isNew ? `Add ${label}` : 'Save changes'}</button>
        <button class="btn" type="button" data-action="cancel">Cancel</button>
        ${isNew ? '' : `<button class="btn danger" type="button" data-action="delete">Delete</button>`}
    </div>`;

// Resolves an image slot: new upload → uploaded path, "remove" ticked → null, else unchanged
async function resolveImage(form, name, current, filename) {
    const file = form.elements[name]?.files[0];
    if (file) return uploadImage(file, filename);
    if (form.elements[`${name}-remove`]?.checked) return null;
    return current ?? null;
}

// Preview newly picked images straight away
view.addEventListener('change', e => {
    if (e.target.type !== 'file' || !e.target.files[0]) return;
    const slot = e.target.closest('.image-slot');
    const url = URL.createObjectURL(e.target.files[0]);
    slot.querySelector('img, .none').outerHTML = `<img src="${url}" alt="">`;
});

// ── Gigs ──────────────────────────────────────────────

function gigsList() {
    const rows = content.gigs.map((g, i) => `
        <tr data-index="${i}" class="${g.date < today ? 'past' : ''}">
            <td class="key">${displayDate(g.date)}</td>
            <td>${esc(g.title)}</td>
            <td class="meta hide-sm">${esc(g.venue)}</td>
            <td class="meta hide-sm">${esc(g.location)}</td>
        </tr>`).join('');
    return `
        <div class="toolbar"><h2>Gigs (${content.gigs.length})</h2>
            <button class="btn primary" data-action="new">+ Add gig</button></div>
        ${rows ? `<table>${rows}</table>` : '<p class="empty">No gigs yet.</p>'}`;
}

function gigForm(gig, isNew) {
    return `
        <form>
            <h2>${isNew ? 'New gig' : 'Edit gig'}</h2>
            <div class="row">
                ${field('date', 'Date', gig.date, { type: 'date', required: true })}
                ${field('title', 'Title', gig.title, { required: true, placeholder: 'LIVE @ …' })}
            </div>
            <div class="row">
                ${field('venue', 'Venue', gig.venue, { required: true })}
                ${field('location', 'Location', gig.location, { required: true, placeholder: 'Berlin, Germany' })}
            </div>
            <div class="row">
                ${field('link', 'Event link', gig.link, { type: 'url', hint: 'optional — used by the "Next gig" bar', placeholder: 'https://ra.co/events/…' })}
                ${field('link_label', 'Link text', gig.link_label, { placeholder: 'Event page' })}
            </div>
            ${area('text', 'Details', gig.text, { hint: 'optional, Markdown' })}
            <div class="images">${imageSlot('image', 'Poster (optional)', gig.image)}</div>
            ${formActions(isNew, 'gig')}
        </form>`;
}

async function submitGig(form, index) {
    const f = form.elements;
    const old = content.gigs[index] ?? {};
    const date = f.date.value;
    const title = f.title.value.trim();
    const image = await resolveImage(form, 'image', old.image, `${date}_${slugify(title)}`);
    const gig = clean({
        date, title,
        venue: f.venue.value.trim(),
        location: f.location.value.trim(),
        image,
        text: f.text.value.trim(),
        link: f.link.value.trim(),
        link_label: f.link_label.value.trim(),
    });
    const gigs = [...content.gigs];
    if (index === -1) gigs.push(gig); else gigs[index] = gig;
    return api('PUT', '/api/gigs', { gigs });
}

// ── Releases ──────────────────────────────────────────

const releaseSlug = id => slugify(id);

function parseBandcamp(raw) {
    if (!raw.trim()) return '';
    const m = raw.match(/(album|track)=(\d+)/);
    if (!m) throw new Error('Could not find album=… or track=… in the Bandcamp field');
    return `${m[1]}=${m[2]}`;
}

function releasesList() {
    const rows = content.releases.map((r, i) => `
        <tr data-index="${i}">
            <td class="key">${esc(r.id)}</td>
            <td>${esc(r.title)}</td>
            <td class="meta hide-sm">${esc(r.format)}</td>
            <td class="meta">${displayDate(r.date)}</td>
        </tr>`).join('');
    return `
        <div class="toolbar"><h2>Releases (${content.releases.length})</h2>
            <button class="btn primary" data-action="new">+ Add release</button></div>
        ${rows ? `<table>${rows}</table>` : '<p class="empty">No releases yet.</p>'}`;
}

function releaseForm(r, isNew) {
    const covers = r.covers ?? [];
    return `
        <form>
            <h2>${isNew ? 'New release' : 'Edit release'}</h2>
            <div class="row">
                ${field('id', 'Catalogue no.', r.id, { required: true, placeholder: 'OMTHM004' })}
                ${field('title', 'Title', r.title, { required: true })}
            </div>
            <div class="row">
                ${field('format', 'Format', r.format, { required: true, list: 'formats', placeholder: '12"' })}
                ${field('date', 'Release date', r.date, { type: 'date', required: true })}
            </div>
            <datalist id="formats"><option value='12"'><option value='2×12"'><option value='7"'><option value="LP"><option value="Digital"></datalist>
            ${field('bandcamp', 'Bandcamp player', r.bandcamp, { hint: 'paste the whole embed code from Bandcamp → Share/Embed, or album=123…' })}
            <div class="images">
                ${imageSlot('cover0', 'Cover / Side A', covers[0])}
                ${imageSlot('cover1', 'Side B (optional)', covers[1])}
            </div>
            ${area('tracklist', 'Tracklist', (r.tracklist ?? []).join('\n'), { hint: 'optional, one track per line' })}
            ${area('body', 'Description', r.body, { long: true, hint: 'Markdown — blank line = new paragraph, *text* = italic' })}
            ${formActions(isNew, 'release')}
        </form>`;
}

async function submitRelease(form, index) {
    const f = form.elements;
    const old = content.releases[index] ?? {};
    const id = f.id.value.trim();
    const slug = releaseSlug(id);
    const sideA = await resolveImage(form, 'cover0', old.covers?.[0], `${slug}-sideA`);
    const sideB = await resolveImage(form, 'cover1', old.covers?.[1], `${slug}-sideB`);
    const data = clean({
        id,
        title: f.title.value.trim(),
        format: f.format.value.trim(),
        date: f.date.value,
        bandcamp: parseBandcamp(f.bandcamp.value),
        covers: [sideA, sideB].filter(Boolean),
        tracklist: f.tracklist.value.split('\n').map(t => t.trim()).filter(Boolean),
    });
    if (index === -1 && content.releases.some(r => r.slug === slug)) {
        throw new Error(`A release with catalogue no. ${id} already exists`);
    }
    return api('PUT', `/api/releases/${slug}`, { data, body: f.body.value, previousSlug: old.slug });
}

// ── News ──────────────────────────────────────────────

function newsList() {
    const rows = content.news.map((p, i) => `
        <tr data-index="${i}">
            <td class="key">${displayDate(p.date)}</td>
            <td>${esc(p.body.split('\n')[0].slice(0, 90))}${p.body.length > 90 ? '…' : ''}</td>
        </tr>`).join('');
    return `
        <div class="toolbar"><h2>News (${content.news.length})</h2>
            <button class="btn primary" data-action="new">+ Add post</button></div>
        ${rows ? `<table>${rows}</table>` : '<p class="empty">No posts yet.</p>'}`;
}

function newsForm(p, isNew) {
    return `
        <form>
            <h2>${isNew ? 'New post' : 'Edit post'}</h2>
            ${field('date', 'Date', p.date ?? today, { type: 'date', required: true })}
            ${area('body', 'Text', p.body, { long: true, required: true, hint: 'Markdown — [link text](https://…) for links' })}
            ${formActions(isNew, 'post')}
        </form>`;
}

async function submitNews(form, index) {
    const f = form.elements;
    const old = content.news[index];
    const body = f.body.value;
    const slug = old?.slug ?? `${f.date.value}-${slugify(body.split(/\s+/).slice(0, 5).join(' ')) || 'post'}`;
    return api('PUT', `/api/news/${slug}`, { data: { date: f.date.value }, body });
}

// ── About ─────────────────────────────────────────────

function aboutForm() {
    return `
        <form>
            <h2>About</h2>
            ${area('body', 'Text', content.about, { long: true, required: true, hint: 'Markdown' })}
            <div class="actions"><button class="btn primary" type="submit">Save changes</button></div>
        </form>`;
}

// ── Wiring ────────────────────────────────────────────

const KINDS = {
    gigs:     { list: gigsList,     form: gigForm,     submit: submitGig,     label: 'Gig',     blank: () => ({}) },
    releases: { list: releasesList, form: releaseForm, submit: submitRelease, label: 'Release', blank: () => ({}) },
    news:     { list: newsList,     form: newsForm,    submit: submitNews,    label: 'Post',    blank: () => ({}) },
};

function render() {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    if (tab === 'about') {
        view.innerHTML = aboutForm();
        return;
    }

    const kind = KINDS[tab];
    if (editing) {
        const item = editing.index === -1 ? kind.blank() : content[tab][editing.index];
        view.innerHTML = kind.form(item, editing.index === -1);
        view.querySelector('input, textarea')?.focus();
    } else {
        view.innerHTML = kind.list();
    }
}

document.querySelector('.tabs').addEventListener('click', e => {
    if (!e.target.dataset.tab) return;
    tab = e.target.dataset.tab;
    editing = null;
    setStatus('');
    render();
});

view.addEventListener('click', e => {
    const action = e.target.closest('[data-action]')?.dataset.action;
    const row = e.target.closest('tr[data-index]');

    if (action === 'new') { editing = { index: -1 }; setStatus(''); render(); }
    else if (row) { editing = { index: Number(row.dataset.index) }; setStatus(''); render(); }
    else if (action === 'cancel') { editing = null; setStatus(''); render(); }
    else if (action === 'delete') {
        const item = content[tab][editing.index];
        const name = item.title ?? displayDate(item.date);
        if (!confirm(`Delete "${name}"? This removes it from the content files (images are kept).`)) return;
        if (tab === 'gigs') {
            const gigs = content.gigs.filter((_, i) => i !== editing.index);
            save(() => api('PUT', '/api/gigs', { gigs }), `${KINDS[tab].label} deleted`);
        } else {
            save(() => api('DELETE', `/api/${tab}/${item.slug}`), `${KINDS[tab].label} deleted`);
        }
    }
});

view.addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target;
    if (tab === 'about') {
        save(() => api('PUT', '/api/about', { body: form.elements.body.value }), 'About saved');
        return;
    }
    const kind = KINDS[tab];
    save(() => kind.submit(form, editing.index), `${kind.label} saved`);
});

window.addEventListener('beforeunload', e => { if (editing) e.preventDefault(); });

api('GET', '/api/content')
    .then(c => { content = c; render(); })
    .catch(err => setStatus(`Could not load content: ${err.message}`, 'err'));
</script>
</body>
</html>
